variables:
  GIT_DEPTH: "1"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  REMOTE_DIR: /opt/lifelog/films
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.gocache

stages:
  - test
  - build
  - deploy

test:
  stage: test
  image: golang:1.26-alpine
  cache:
    key:
      files:
        - go.sum
      prefix: go
    paths:
      - .go/pkg/mod/
      - .gocache/
  script:
    - gofmt -l $(find . -path ./.go -prune -o -path ./.gocache -prune -o -path ./.claude -prune -o -name '*.go' -print) | tee fmt.txt && test ! -s fmt.txt
    - go vet ./...
    - go test ./...
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build:
  stage: build
  image: docker:27
  dependencies: []
  services:
    - docker:27-dind
  variables:
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker pull $DOCKER_IMAGE:builder || true
    - docker pull $DOCKER_IMAGE:latest || true
    - docker build --target builder --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from $DOCKER_IMAGE:builder -t $DOCKER_IMAGE:builder .
    - docker push $DOCKER_IMAGE:builder
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from $DOCKER_IMAGE:builder --cache-from $DOCKER_IMAGE:latest
      -t $DOCKER_IMAGE:$CI_COMMIT_SHA -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

deploy:
  stage: deploy
  image: alpine:3.20
  dependencies: []
  cache: {}
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - ssh $VPS_USER@$VPS_HOST "mkdir -p $REMOTE_DIR"
    - if [ -f "$CONFIG" ]; then cp "$CONFIG" films.env; else printf "%s\n" "$CONFIG" > films.env; fi
    - printf '\nFILMS_IMAGE=%s\n' "$DOCKER_IMAGE:$CI_COMMIT_SHA" >> films.env
    - scp deploy/films.yml $VPS_USER@$VPS_HOST:$REMOTE_DIR/
    - scp films.env $VPS_USER@$VPS_HOST:$REMOTE_DIR/.env
    - ssh $VPS_USER@$VPS_HOST "
        chmod 600 $REMOTE_DIR/.env &&
        cd $REMOTE_DIR &&
        echo $REGISTRY_PASS | docker login -u $REGISTRY_USER --password-stdin $CI_REGISTRY &&
        docker compose -f films.yml --env-file .env pull &&
        docker ps -aq --filter label=com.docker.compose.project=lifelog-trips --filter label=com.docker.compose.service=trips | xargs -r docker rm -f &&
        docker compose -f films.yml --env-file .env up -d --no-deps films auth trips calendar notes notify &&
        docker image prune -f &&
        docker images --filter=reference='$DOCKER_IMAGE:*' --format '{{.CreatedAt}}\t{{.Repository}}:{{.Tag}}' | sort -r | tail -n +3 | cut -f2 | xargs -r docker rmi &&
        docker builder prune -af --filter until=24h
      "
    - sleep 15
    - ssh $VPS_USER@$VPS_HOST "curl -s -o /dev/null -w '%{http_code}' --max-time 20 'https://lifel0g.ru/api/v1/films?limit=1'" > films.code
    - ssh $VPS_USER@$VPS_HOST "curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://lifel0g.ru/.well-known/jwks.json" > auth.code
    - ssh $VPS_USER@$VPS_HOST "curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://lifel0g.ru/api/dictionary/countries" > trips.code
    - cat films.code auth.code trips.code
    - test "$(cat films.code)" = "200" && test "$(cat auth.code)" = "200" && test "$(cat trips.code)" = "401"
  environment:
    name: production
    url: https://lifel0g.ru
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
