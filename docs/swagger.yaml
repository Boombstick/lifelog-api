        здесь нет.
      parameters:
      - description: watchlist (по умолчанию), watched, rated
        in: query
        name: set
        type: string
      - description: added, watched, rate, title. По умолчанию — свой для каждого
          набора. rate доступен только в rated, watched — в watched и rated
        in: query
        name: sort
        type: string
      - description: Размер страницы, по умолчанию 20, максимум 50
        in: query
