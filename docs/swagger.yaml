        и ничего не отмечает.
      parameters:
      - description: Film Id
        in: path
        name: id
        required: true
        type: integer
      - description: Оценка и отзыв
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/lifelog-api_internal_service.CreateReviewRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Оценить фильм и/или оставить отзыв
      tags:
      - Film
  /films/{id}/seasons/{number}:
    put:
      consumes:
      - application/json
      description: 'state: watching, watched or null (removes the entry); rate 1..10
        only with watched. An absent rate keeps the current one; a rate without a
        state key changes only the rating of a watched season. An empty body removes
        the entry.'
      parameters:
      - description: Series id
        in: path
        name: id
        required: true
        type: integer
      - description: Season number
        in: path
        name: number
        required: true
        type: integer
      - description: State and optional rate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.seasonStateRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "409":
          description: Conflict
      security:
      - BearerAuth: []
      summary: Set a season's state and rating
      tags:
      - Series
  /films/{id}/seasons/watched:
    post:
      description: Sets every aired regular season, or those up to up_to, to watched;
        season ratings stay.
      parameters:
      - description: Series id
        in: path
        name: id
        required: true
        type: integer
      - description: Optional up_to
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_handler.markSeasonsRequest'
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Mark all aired seasons watched
      tags:
      - Series
  /films/{id}/similar:
    get:
      description: |-
        source=tmdb отдаёт готовый список TMDB, source=own — наш подбор
        по индексу. Поле source в ответе говорит, что реально отдали:
        списка TMDB на каждый фильм нет, и тогда сервер отдаёт свой.
      parameters:
      - description: Film Id
        in: path
        name: id
        required: true
        type: integer
      - description: tmdb (по умолчанию) или own
        in: query
        name: source
        type: string
      - description: Сколько вернуть, по умолчанию 12, максимум 50
        in: query
        name: limit
