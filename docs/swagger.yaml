      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SimilarFilms'
        "400":
          description: Bad Request
        "502":
          description: Bad Gateway
      summary: Похожие фильмы
