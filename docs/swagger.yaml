      parameters:
      - description: Идентификатор фильма
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Снять отметку о просмотре
      tags:
      - Film
    post:
      parameters:
      - description: Film Id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Отметить фильм просмотренным
