basePath: /api/v1
definitions:
  internal_handler.markSeasonsRequest:
    properties:
      up_to:
        type: integer
    type: object
  internal_handler.seasonStateRequest:
    properties:
      rate:
        type: integer
      state:
        type: string
    type: object
  internal_handler.sharedListCreateRequest:
    properties:
      member_ids:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  internal_handler.sharedListDrawRequest:
    properties:
      count:
        type: integer
      mode:
        type: string
    type: object
  internal_handler.sharedListItemRequest:
    properties:
      film_id:
        type: integer
    type: object
  internal_handler.sharedListUpdateRequest:
    properties:
      member_ids:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  internal_handler.tmdbAddRequest:
    properties:
      kind:
        type: string
      tmdb_id:
        description: |-
          A pointer tells a missing id from 0; a string or a fraction fails to
          decode into int64 and is a 400.
        type: integer
    type: object
  internal_handler.visibilityRequest:
    properties:
      rated:
        type: string
      watched:
        type: string
      watchlist:
        type: string
    type: object
  internal_handler.visibilityResponse:
    properties:
      rated:
        type: string
      watched:
        type: string
      watchlist:
        type: string
    type: object
  lifelog-api_internal_imdbimport.JobResponse:
    properties:
      added:
        type: integer
      catalog_added:
        type: integer
      created_at:
        type: string
      error:
        type: string
      failed:
        type: integer
      finished_at:
        type: string
      id:
        type: integer
      kind:
        $ref: '#/definitions/lifelog-api_internal_imdbimport.ListKind'
      not_found:
        type: integer
      not_found_items:
        description: |-
          Pointer so the list can leave the field out while a single job always
          carries it, as [] when nothing was missed.
        items:
          $ref: '#/definitions/lifelog-api_internal_imdbimport.NotFoundItem'
        type: array
      processed:
        type: integer
      skipped_existing:
        type: integer
      source:
        type: string
      status:
        $ref: '#/definitions/lifelog-api_internal_imdbimport.Status'
      total:
        type: integer
      unsupported:
        type: integer
    type: object
  lifelog-api_internal_imdbimport.JobsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_imdbimport.JobResponse'
        type: array
    type: object
  lifelog-api_internal_imdbimport.ListKind:
    enum:
    - ratings
    - watchlist
    type: string
    x-enum-varnames:
    - ListRatings
    - ListWatchlist
  lifelog-api_internal_imdbimport.NotFoundItem:
    properties:
      imdb_id:
        type: string
      title:
        type: string
      year:
        type: integer
    type: object
  lifelog-api_internal_imdbimport.Status:
    enum:
    - queued
    - running
    - done
    - failed
    type: string
    x-enum-varnames:
    - StatusQueued
    - StatusRunning
    - StatusDone
    - StatusFailed
  lifelog-api_internal_model.ModerationStatus:
    enum:
    - unknown
    - pending
    - approved
    - rejected
    type: string
    x-enum-varnames:
    - ModerationStatusUnknown
    - ModerationStatusPending
    - ModerationStatusApproved
    - ModerationStatusRejected
  lifelog-api_internal_service.AddReviewRequest:
    properties:
      description:
        type: string
      rate:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - rate
    type: object
  lifelog-api_internal_service.CityPage:
    properties:
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.CityResponse'
        type: array
      next_cursor:
        type: string
    type: object
  lifelog-api_internal_service.CityResponse:
    properties:
      country_code:
        type: string
      id:
        type: integer
      lat:
        type: number
      lon:
        type: number
      name_en:
        type: string
      name_ru:
        type: string
      population:
        type: integer
    type: object
  lifelog-api_internal_service.CombinedSearch:
    properties:
      films:
        $ref: '#/definitions/lifelog-api_internal_service.SearchPage-lifelog-api_internal_service_FilmSearchItem'
      people:
        $ref: '#/definitions/lifelog-api_internal_service.SearchPage-lifelog-api_internal_service_PersonSearchItem'
      top:
        type: string
    type: object
  lifelog-api_internal_service.CountryResponse:
    properties:
      code:
        type: string
      name_en:
        type: string
      name_ru:
        type: string
    type: object
  lifelog-api_internal_service.CreatePlaceRequest:
    properties:
      address:
        example: Ленина
        maxLength: 128
        type: string
      category:
        example: Кафе
        maxLength: 32
        type: string
      city_id:
        type: integer
      country_code:
        description: |-
          CountryCode и CityID берутся из справочника географии, а не вводятся
          строкой: иначе «Таиланд», «Тайланд» и «Thailand» станут тремя странами
          и фильтр по стране начнёт врать.
        example: TH
        type: string
      kind:
        description: |-
          Kind — тип места из фиксированного перечня: food, culture, park, stay, other.
          Необязателен: без него место получает other.
        example: food
        type: string
      lat:
        type: number
      lon:
        type: number
      name:
        example: Alex
        maxLength: 128
        type: string
    required:
    - address
    - category
    - name
    type: object
  lifelog-api_internal_service.CreatePlaceResponse:
    properties:
      id:
        type: integer
    type: object
  lifelog-api_internal_service.CreateReviewRequest:
    properties:
      description:
        maxLength: 255
        type: string
      rate:
        maximum: 10
        minimum: 1
        type: integer
    type: object
  lifelog-api_internal_service.Facet:
    properties:
      count:
        type: integer
      key:
        type: string
    type: object
  lifelog-api_internal_service.FilmBoundsResponse:
    properties:
      runtime_max:
        type: integer
      runtime_min:
        type: integer
      year_max:
        type: integer
      year_min:
        type: integer
    type: object
  lifelog-api_internal_service.FilmCard:
    properties:
      credits:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.FilmCardCredit'
        type: array
      genre_slugs:
        items:
          type: string
        type: array
      genres:
        items:
          type: string
        type: array
      id:
        type: integer
      imdb_id:
        type: string
      kind:
        type: string
      local_rating:
        type: number
      local_votes:
        type: integer
      my_entry:
        allOf:
        - $ref: '#/definitions/lifelog-api_internal_service.FilmCardEntry'
        description: |-
          MyEntry is nil both without a token and when the viewer marked nothing:
          the client tells those apart by whether it sent a token.
      poster_url:
        type: string
      release_date:
        type: string
      reviews:
        description: Reviews are other people's entries, already filtered by visibility.
        items:
          $ref: '#/definitions/lifelog-api_internal_service.FilmCardReview'
        type: array
      runtime:
        type: integer
      seasons:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.FilmCardSeason'
        type: array
      series:
        allOf:
        - $ref: '#/definitions/lifelog-api_internal_service.FilmCardSeries'
        description: Series and Seasons are present only for kind "series".
      synopsis:
        type: string
      title:
        type: string
      title_original:
        type: string
      tmdb_id:
        type: integer
      tmdb_rating:
        type: number
      tmdb_votes:
        type: integer
      year:
        type: integer
    type: object
  lifelog-api_internal_service.FilmCardCredit:
    properties:
      billing_order:
        type: integer
      name:
        type: string
      original_name:
        type: string
      person_id:
        type: integer
      photo_url:
        type: string
      role:
        type: string
    type: object
  lifelog-api_internal_service.FilmCardEntry:
    properties:
      current_season:
        type: integer
      description:
        type: string
      progress:
        $ref: '#/definitions/lifelog-api_internal_service.FilmCardProgress'
      rate:
        type: integer
      seasons:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.FilmCardSeasonEntry'
        type: array
      series_rating:
        type: number
      series_state:
        description: Series-only tracking fields, filled by applySeriesProgress.
        type: string
      series_watched:
        type: boolean
      watched_at:
        type: string
      watchlisted:
        type: boolean
    type: object
  lifelog-api_internal_service.FilmCardProgress:
    properties:
      aired:
        type: integer
      watched:
        type: integer
    type: object
  lifelog-api_internal_service.FilmCardReview:
    properties:
      description:
        type: string
      rate:
        type: integer
      user_name:
        type: string
      watched_at:
        type: string
    type: object
  lifelog-api_internal_service.FilmCardSeason:
    properties:
      air_date:
        type: string
      aired:
        description: Aired is computed here so clients never compare clocks.
        type: boolean
      episode_count:
        type: integer
      id:
        type: integer
      name:
        type: string
      number:
        type: integer
      poster_url:
        type: string
    type: object
  lifelog-api_internal_service.FilmCardSeasonEntry:
    properties:
      number:
        type: integer
      rate:
        type: integer
      state:
        type: string
    type: object
  lifelog-api_internal_service.FilmCardSeries:
    properties:
      first_air_date:
        type: string
      in_production:
        type: boolean
      last_air_date:
        type: string
      networks:
        items:
          type: string
        type: array
      next_air_date:
        type: string
      number_of_episodes:
        type: integer
      number_of_seasons:
        type: integer
      status:
        type: string
      type:
        type: string
    type: object
  lifelog-api_internal_service.FilmCatalogItem:
    properties:
      id:
        type: integer
      kind:
        type: string
      local_rating:
        type: number
      local_votes:
        type: integer
      poster_url:
        type: string
      title:
        type: string
      tmdb_rating:
        type: number
      year:
        type: integer
    type: object
  lifelog-api_internal_service.FilmEntryResponse:
    properties:
      description:
        type: string
      film_id:
        type: integer
      rate:
        type: integer
      watched_at:
        type: string
      watchlisted:
        type: boolean
    type: object
  lifelog-api_internal_service.FilmSearchItem:
    properties:
      directors:
        items:
          type: string
        type: array
      genres:
        items:
          type: string
        type: array
      id:
        type: integer
      kind:
        type: string
      local_rating:
        type: number
      local_votes:
        type: integer
      poster_url:
        type: string
      runtime:
        type: integer
      title:
        type: string
      tmdb_rating:
        type: number
      year:
        type: integer
    type: object
  lifelog-api_internal_service.FilmographyItem:
    properties:
      genres:
        items:
          type: string
        type: array
      id:
        type: integer
      kind:
        type: string
      local_rating:
        type: number
      local_votes:
        type: integer
      poster_url:
        type: string
      roles:
        items:
          type: string
        type: array
      runtime:
        type: integer
      title:
        type: string
      tmdb_rating:
        type: number
      year:
        type: integer
    type: object
  lifelog-api_internal_service.GenreResponse:
    properties:
      name_en:
        type: string
      name_ru:
        type: string
      slug:
        type: string
    type: object
  lifelog-api_internal_service.MyFilmCounts:
    properties:
      rated:
        type: integer
      watched:
        type: integer
      watching:
        type: integer
      watchlist:
        type: integer
    type: object
  lifelog-api_internal_service.MyFilmItem:
    properties:
      added_at:
        type: string
      description:
        type: string
      genres:
        items:
          type: string
        type: array
      id:
        type: integer
      kind:
        type: string
      local_rating:
        type: number
      local_votes:
        type: integer
      poster_url:
        type: string
      rate:
        type: integer
      runtime:
        type: integer
      series_rating:
        type: number
      title:
        type: string
      tmdb_rating:
        type: number
      watched_at:
        type: string
      watchlisted:
        type: boolean
      year:
        type: integer
    type: object
  lifelog-api_internal_service.MyFilmsPage:
    properties:
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.MyFilmItem'
        type: array
      next_cursor:
        type: string
      total:
        type: integer
    type: object
  lifelog-api_internal_service.PersonCard:
    properties:
      film_count:
        type: integer
      films:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.FilmographyItem'
        type: array
      id:
        type: integer
      name:
        type: string
      original_name:
        type: string
      photo_url:
        type: string
      roles:
        items:
          type: string
        type: array
    type: object
  lifelog-api_internal_service.PersonSearchItem:
    properties:
      film_count:
        type: integer
      id:
        type: integer
      known_for:
        items:
          type: string
        type: array
      name:
        type: string
      original_name:
        type: string
      photo_url:
        type: string
      roles:
        items:
          type: string
        type: array
    type: object
  lifelog-api_internal_service.PlacePage:
    properties:
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.PlaceResponse'
        type: array
      next_cursor:
        type: string
    type: object
  lifelog-api_internal_service.PlaceResponse:
    properties:
      address:
        type: string
      category:
        type: string
      city_id:
        type: integer
      city_name:
        type: string
      country_code:
        type: string
      country_name:
        type: string
      id:
        type: integer
      kind:
        type: string
      lat:
        type: number
      lon:
        type: number
      moderation_status:
        $ref: '#/definitions/lifelog-api_internal_model.ModerationStatus'
      name:
        type: string
    type: object
  lifelog-api_internal_service.RecommendedFilms:
    properties:
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.FilmSearchItem'
        type: array
    type: object
  lifelog-api_internal_service.SearchPage-lifelog-api_internal_service_FilmCatalogItem:
    properties:
      facets:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.Facet'
        type: array
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.FilmCatalogItem'
        type: array
      next_cursor:
        type: string
      total:
        type: integer
    type: object
  lifelog-api_internal_service.SearchPage-lifelog-api_internal_service_FilmSearchItem:
    properties:
      facets:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.Facet'
        type: array
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.FilmSearchItem'
        type: array
      next_cursor:
        type: string
      total:
        type: integer
    type: object
  lifelog-api_internal_service.SearchPage-lifelog-api_internal_service_PersonSearchItem:
    properties:
      facets:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.Facet'
        type: array
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.PersonSearchItem'
        type: array
      next_cursor:
        type: string
      total:
        type: integer
    type: object
  lifelog-api_internal_service.SharedListCard:
    properties:
      created_at:
        type: string
      draws:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.SharedListDraw'
        type: array
      id:
        type: integer
      is_owner:
        type: boolean
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.SharedListItem'
        type: array
      items_count:
        type: integer
      last_draw:
        $ref: '#/definitions/lifelog-api_internal_service.SharedListDraw'
      members:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.UserRef'
        type: array
      members_count:
        type: integer
      owner:
        $ref: '#/definitions/lifelog-api_internal_service.UserRef'
      title:
        type: string
      updated_at:
        type: string
    type: object
  lifelog-api_internal_service.SharedListDraw:
    properties:
      count:
        type: integer
      created_at:
        type: string
      drawn_by:
        $ref: '#/definitions/lifelog-api_internal_service.UserRef'
      films:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.FilmSearchItem'
        type: array
      id:
        type: integer
      mode:
        type: string
    type: object
  lifelog-api_internal_service.SharedListDrawsPage:
    properties:
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.SharedListDraw'
        type: array
    type: object
  lifelog-api_internal_service.SharedListItem:
    properties:
      added_at:
        type: string
      added_by:
        $ref: '#/definitions/lifelog-api_internal_service.UserRef'
      film:
        $ref: '#/definitions/lifelog-api_internal_service.FilmSearchItem'
    type: object
  lifelog-api_internal_service.SharedListSummary:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_owner:
        type: boolean
      items_count:
        type: integer
      last_draw:
        $ref: '#/definitions/lifelog-api_internal_service.SharedListDraw'
      members_count:
        type: integer
      owner:
        $ref: '#/definitions/lifelog-api_internal_service.UserRef'
      title:
        type: string
      updated_at:
        type: string
    type: object
  lifelog-api_internal_service.SharedListsPage:
    properties:
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.SharedListSummary'
        type: array
    type: object
  lifelog-api_internal_service.SimilarFilms:
    properties:
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_service.FilmSearchItem'
        type: array
      source:
        type: string
    type: object
  lifelog-api_internal_service.StartSyncRequest:
    properties:
      year_from:
        type: integer
      year_to:
        type: integer
    required:
    - year_from
    - year_to
    type: object
  lifelog-api_internal_service.SyncState:
    enum:
    - idle
    - running
    - succeeded
    - failed
    type: string
    x-enum-varnames:
    - SyncStateIdle
    - SyncStateRunning
    - SyncStateSucceeded
    - SyncStateFailed
  lifelog-api_internal_service.SyncStats:
    properties:
      failed:
        type: integer
      fetched:
        type: integer
      requested:
        type: integer
      saved:
        type: integer
      skipped:
        type: integer
    type: object
  lifelog-api_internal_service.SyncStatusResponse:
    properties:
      error:
        type: string
      finished_at:
        type: string
      index_stale:
        description: |-
          IndexStale — импорт записал новые карточки, а Elasticsearch о них не
          знает: ручка индекс не трогает, переиндексацию делает cmd/indexer.
        type: boolean
      run_id:
        type: string
      started_at:
        type: string
      state:
        $ref: '#/definitions/lifelog-api_internal_service.SyncState'
      stats:
        $ref: '#/definitions/lifelog-api_internal_service.SyncStats'
      year_from:
        type: integer
      year_to:
        type: integer
    type: object
  lifelog-api_internal_service.UpdatePlaceRequest:
    properties:
      address:
        example: Ленина
        maxLength: 128
        type: string
      category:
        example: Кафе
        maxLength: 32
        type: string
      city_id:
        type: integer
      country_code:
        description: |-
          CountryCode и CityID берутся из справочника географии, а не вводятся
          строкой: иначе «Таиланд», «Тайланд» и «Thailand» станут тремя странами
          и фильтр по стране начнёт врать.
        example: TH
        type: string
      kind:
        description: |-
          Kind — тип места из фиксированного перечня: food, culture, park, stay, other.
          Необязателен: без него место получает other.
        example: food
        type: string
      lat:
        type: number
      lon:
        type: number
      name:
        example: Alex
        maxLength: 128
        type: string
    required:
    - address
    - category
    - name
    type: object
  lifelog-api_internal_service.UserRef:
    properties:
      auth_user_id:
        format: uuid
        type: string
      name:
        type: string
    type: object
  lifelog-api_internal_tmdbadd.AddResponse:
    properties:
      created:
        type: boolean
      id:
        type: integer
    type: object
  lifelog-api_internal_tmdbadd.SearchItem:
    properties:
      catalog_id:
        type: integer
      kind:
        type: string
      original_title:
        type: string
      overview:
        type: string
      poster_url:
        type: string
      title:
        type: string
      tmdb_id:
        type: integer
      vote_average:
        type: number
      vote_count:
        type: integer
      year:
        type: integer
    type: object
  lifelog-api_internal_tmdbadd.SearchResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/lifelog-api_internal_tmdbadd.SearchItem'
        type: array
      page:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact: {}
  description: Личный справочник мест
  title: LifeLog API
  version: "1.0"
paths:
  /admin/films/sync:
    get:
      description: Состояние последнего прогона в этом процессе. После перезапуска
        сервиса — idle.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SyncStatusResponse'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Состояние синхронизации каталога
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: 'Импорт идёт в фоне: ручка отвечает сразу идентификатором прогона,
        ход смотреть через GET той же ручки. Пока прогон идёт, второй запуск отбивается
        409. Переиндексация Elasticsearch в импорт не входит — её делает cmd/indexer.'
      parameters:
      - description: Границы по году выпуска
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/lifelog-api_internal_service.StartSyncRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SyncStatusResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SyncStatusResponse'
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Запустить синхронизацию каталога с TMDB
      tags:
      - Admin
  /films:
    get:
      description: Тот же механизм, что и у поиска, только без строки запроса.
      parameters:
      - description: Слаги жанров через запятую, между ними ИЛИ
        in: query
        name: genre
        type: string
      - description: Год выпуска, от
        in: query
        name: year_from
        type: integer
      - description: Год выпуска, до
        in: query
        name: year_to
        type: integer
      - description: Длительность в минутах, от
        in: query
        name: runtime_from
        type: integer
      - description: Длительность в минутах, до
        in: query
        name: runtime_to
        type: integer
      - description: Рейтинг TMDB, от
        in: query
        name: rating_from
        type: number
      - description: Рейтинг LifeLog, от
        in: query
        name: local_from
        type: number
      - description: popularity, tmdb_rating, local_rating, year, runtime, title
        in: query
        name: sort
        type: string
      - description: asc или desc; по умолчанию asc у title, desc у остального
        in: query
        name: order
        type: string
      - description: Размер страницы, по умолчанию 20, максимум 50
        in: query
        name: limit
        type: integer
      - description: Курсор следующей страницы из next_cursor
        in: query
        name: cursor
        type: string
      - description: Убрать фильмы с отметкой «просмотрено». Требует токена
        in: query
        name: hide_watched
        type: boolean
      - description: Вернуть количество фильмов по жанрам
        in: query
        name: facets
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SearchPage-lifelog-api_internal_service_FilmCatalogItem'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "502":
          description: Bad Gateway
      security:
      - BearerAuth: []
      summary: Каталог фильмов с фильтрами и пагинацией
      tags:
      - Film
  /films/{id}:
    get:
      description: Without a token, catalog fields only. With a token, adds the viewer
        own entry (my_entry) and reviews by others that subscription rules allow (reviews).
      parameters:
      - description: Film Id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.FilmCard'
        "404":
          description: Not Found
      summary: Получить фильм
      tags:
      - Film
  /films/{id}/dropped:
    delete:
      parameters:
      - description: Series id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Remove the dropped mark
      tags:
      - Series
    post:
      parameters:
      - description: Series id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Mark a series as dropped
      tags:
      - Series
  /films/{id}/entry:
    get:
      description: 'Отметка текущего пользователя: список «посмотреть», просмотр,
        оценка, отзыв.'
