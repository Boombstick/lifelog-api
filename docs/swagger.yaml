      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.PlaceResponse'
      summary: получить место
      tags:
      - Place
    put:
      consumes:
      - application/json
      description: Менять место может только его автор или администратор.
      parameters:
      - description: Place Id
        in: path
        name: id
        required: true
        type: integer
      - description: Данные места
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/lifelog-api_internal_service.UpdatePlaceRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: изменить место
      tags:
      - Place
  /places/{id}/review:
    post:
      consumes:
      - application/json
      parameters:
      - description: Place Id
        in: path
        name: id
        required: true
        type: integer
      - description: Отзыв, не длиннее 255 символов
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/lifelog-api_internal_service.AddReviewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.CreatePlaceResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: добавить отзыв на место
      tags:
      - Place
  /search:
    get:
      description: |-
        Поле top говорит, какой блок показывать первым: films или people.
        Решает сервер: полное совпадение со строкой поиска выносит вперёд
        фильм, иначе — людей.
      parameters:
      - description: Строка поиска
        in: query
        name: q
        type: string
      - description: Сколько результатов в каждом разделе, по умолчанию 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.CombinedSearch'
        "400":
          description: Bad Request
      summary: Поиск по фильмам и людям сразу
      tags:
      - Search
  /search/films:
    get:
      parameters:
      - description: Строка поиска; без неё это просто каталог с фильтрами
        in: query
        name: q
        type: string
      - description: 'Где искать: all (по умолчанию), title — только по названию,
          cast — только по актёрам и режиссёрам'
        in: query
        name: scope
        type: string
      - description: Слаги жанров через запятую, между ними ИЛИ
        in: query
        name: genre
        type: string
      - description: Год выпуска, от
        in: query
        name: year_from
        type: integer
      - description: Год выпуска, до
        in: query
        name: year_to
        type: integer
      - description: Длительность в минутах, от
        in: query
        name: runtime_from
        type: integer
      - description: Длительность в минутах, до
        in: query
        name: runtime_to
        type: integer
      - description: Рейтинг TMDB, от
        in: query
        name: rating_from
        type: number
      - description: Рейтинг LifeLog, от
        in: query
        name: local_from
        type: number
      - description: relevance, popularity, tmdb_rating, local_rating, year, runtime,
          title
        in: query
        name: sort
        type: string
      - description: asc или desc; по умолчанию asc у title, desc у остального
        in: query
        name: order
        type: string
      - description: Размер страницы, по умолчанию 20, максимум 50
        in: query
        name: limit
        type: integer
      - description: Курсор следующей страницы из next_cursor
        in: query
        name: cursor
        type: string
      - description: Убрать фильмы с отметкой «просмотрено». Требует токена
        in: query
        name: hide_watched
        type: boolean
      - description: Вернуть количество фильмов по жанрам
        in: query
        name: facets
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SearchPage-lifelog-api_internal_service_FilmSearchItem'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Поиск фильмов с фильтрами
      tags:
      - Search
  /search/people:
    get:
      parameters:
      - description: Строка поиска
        in: query
        name: q
        type: string
      - description: Размер страницы, по умолчанию 20, максимум 50
        in: query
        name: limit
        type: integer
      - description: Курсор следующей страницы из next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SearchPage-lifelog-api_internal_service_PersonSearchItem'
        "400":
          description: Bad Request
      summary: Поиск людей — актёров и режиссёров
      tags:
      - Search
  /shared-lists:
    get:
      description: Где я создатель или участник, свежие изменения первыми.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SharedListsPage'
      security:
      - BearerAuth: []
      summary: Мои совместные списки
      tags:
      - SharedLists
    post:
      consumes:
      - application/json
      description: Добавить можно только одобренного подписчика создателя, не больше
        20. Подписки проверяет auth; недоступен — 503.
      parameters:
      - description: Название и участники
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.sharedListCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SharedListCard'
        "400":
          description: Bad Request
        "503":
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Создать совместный список
      tags:
      - SharedLists
  /shared-lists/{id}:
    delete:
      description: Только создатель. Удаляет у всех, вместе с фильмами и розыгрышами.
      parameters:
      - description: Идентификатор списка
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Удалить совместный список
      tags:
      - SharedLists
    get:
      parameters:
      - description: Идентификатор списка
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SharedListCard'
        "404":
          description: Not Found
        "503":
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Карточка совместного списка
      tags:
      - SharedLists
    patch:
      consumes:
      - application/json
      description: Только создатель. member_ids заменяет состав целиком; подписка
        проверяется только у добавляемых, auth недоступен — 503.
      parameters:
      - description: Идентификатор списка
        in: path
        name: id
        required: true
        type: integer
      - description: Меняемые поля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.sharedListUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SharedListCard'
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "503":
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Изменить совместный список
      tags:
      - SharedLists
  /shared-lists/{id}/draws:
    get:
      parameters:
      - description: Идентификатор списка
        in: path
        name: id
        required: true
        type: integer
      - description: До 50, по умолчанию 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SharedListDrawsPage'
        "404":
          description: Not Found
        "503":
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: История розыгрышей
      tags:
      - SharedLists
    post:
      consumes:
      - application/json
      description: one — один фильм; top — count (3..10) разных фильмов, но не больше,
        чем есть в списке. count в ответе — сколько фильмов выпало.
      parameters:
      - description: Идентификатор списка
        in: path
        name: id
        required: true
        type: integer
      - description: Режим
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.sharedListDrawRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SharedListDraw'
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "409":
          description: Conflict
        "503":
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Случайный выбор из совместного списка
      tags:
      - SharedLists
  /shared-lists/{id}/items:
    post:
      consumes:
      - application/json
      description: Повтор того же фильма — 200 с уже существующим элементом.
      parameters:
      - description: Идентификатор списка
        in: path
        name: id
        required: true
        type: integer
      - description: Фильм
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.sharedListItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SharedListItem'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.SharedListItem'
        "404":
          description: Not Found
        "409":
          description: Conflict
        "503":
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Добавить фильм в совместный список
      tags:
      - SharedLists
  /shared-lists/{id}/items/{film_id}:
    delete:
      description: Может любой участник.
      parameters:
      - description: Идентификатор списка
        in: path
        name: id
        required: true
        type: integer
      - description: Идентификатор фильма
        in: path
        name: film_id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
        "503":
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Убрать фильм из совместного списка
      tags:
      - SharedLists
  /shared-lists/{id}/leave:
    post:
      description: 'Участник, не создатель: создателю — 400.'
      parameters:
      - description: Идентификатор списка
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "503":
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Выйти из совместного списка
      tags:
      - SharedLists
  /tmdb/add:
    post:
      consumes:
      - application/json
      description: Догружает карточку из TMDB без порога голосов (у сериала — с сезонами)
        и сразу индексирует. Уже есть в каталоге — 200 с created=false, лимит не тратится.
        Не больше 20 добавлений за скользящие сутки.
      parameters:
      - description: Что добавить
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.tmdbAddRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_tmdbadd.AddResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/lifelog-api_internal_tmdbadd.AddResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "429":
          description: Too Many Requests
        "503":
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Добавить в каталог из TMDB
      tags:
      - TMDB
  /tmdb/search:
    get:
      description: Фильмы и сериалы из TMDB (/search/multi, ru-RU, без взрослого),
        в порядке TMDB. catalog_id — id нашей карточки, если она уже в каталоге. query
        после обрезки 2..100 символов, page 1..20.
      parameters:
      - description: Строка поиска
        in: query
        name: query
        required: true
        type: string
      - default: 1
        description: Страница, 1..20
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_tmdbadd.SearchResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "503":
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: Поиск в TMDB
      tags:
      - TMDB
  /users/{id}/films:
    get:
      description: Идентификатор — uuid учётки auth, тот же, что в подписках.
      parameters:
      - description: Идентификатор учётки
        in: path
        name: id
        required: true
        type: string
      - description: watchlist, watched, rated
        in: query
        name: set
        type: string
      - description: added, watched, rate, title
        in: query
        name: sort
        type: string
      - description: Размер страницы
        in: query
        name: limit
        type: integer
      - description: Курсор следующей страницы
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lifelog-api_internal_service.MyFilmsPage'
        "403":
          description: Forbidden
        "404":
          description: Not Found
      security:
      - BearerAuth: []
      summary: Список фильмов другого пользователя
      tags:
      - Sharing
securityDefinitions:
  BearerAuth:
    description: 'Введите токен в формате: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
