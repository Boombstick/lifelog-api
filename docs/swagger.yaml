      - BearerAuth: []
      summary: Своя отметка о фильме
      tags:
      - Film
  /films/{id}/review:
    delete:
      parameters:
      - description: Идентификатор фильма
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Снять оценку и отзыв
      tags:
      - Film
    post:
      consumes:
      - application/json
      description: Оценка сама ставит просмотр, если его не было, и убирает фильм
